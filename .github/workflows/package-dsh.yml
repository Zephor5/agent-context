name: Release CLI and DSH plugin
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - integrations/dsh/package.json
permissions:
  contents: read

concurrency:
  group: agent-context-release-${{ github.ref }}
  queue: max

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      cli: ${{ steps.version.outputs.cli }}
      plugin: ${{ steps.version.outputs.plugin }}
      cli_version: ${{ steps.version.outputs.cli_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect version increases across the push
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/versions.py "$BEFORE" >> "$GITHUB_OUTPUT"

  test-plugin:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm test --prefix integrations/dsh && npm run build:web --prefix integrations/dsh

  native:
    needs: versions
    if: needs.versions.outputs.cli == 'true'
    strategy:
      matrix:
        include:
          - { runner: macos-15, platform: darwin-arm64, target: aarch64-apple-darwin }
          - { runner: macos-15-intel, platform: darwin-x64, target: x86_64-apple-darwin }
          - { runner: ubuntu-24.04, platform: linux-x64, target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, target: aarch64-unknown-linux-musl }
          - { runner: windows-2022, platform: win32-x64, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y musl-tools
      - name: Build CLI
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --locked --release --target ${{ matrix.target }}
          dest=integrations/dsh/native/${{ matrix.platform }}
          mkdir -p "$dest"
          cp target/${{ matrix.target }}/release/agent-context${{ runner.os == 'Windows' && '.exe' || '' }} "$dest/"
      - name: Check executable version
        env:
          CLI_VERSION: ${{ needs.versions.outputs.cli_version }}
        run: |
          exe=integrations/dsh/native/${{ matrix.platform }}/agent-context${{ runner.os == 'Windows' && '.exe' || '' }}
          test "$("$exe" --version | tr -d '\r')" = "agent-context $CLI_VERSION"
      - name: Test with a clean vault and the packaged executable
        working-directory: integrations/dsh
        env:
          REQUIRE_NATIVE: 1
        run: node --test test/oneclick.test.js test/web-host.test.js
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: integrations/dsh/native/${{ matrix.platform }}/
          if-no-files-found: error

  cli-release:
    needs: [versions, native]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish the tested native executables
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_VERSION: ${{ needs.versions.outputs.cli_version }}
        run: bash .github/scripts/release-cli.sh

  package:
    needs: [versions, cli-release]
    if: >-
      ${{ !cancelled() && needs.versions.result == 'success' &&
          (needs.cli-release.result == 'success' || needs.cli-release.result == 'skipped') &&
          (needs.versions.outputs.cli != 'true' || needs.cli-release.result == 'success') &&
          (needs.versions.outputs.plugin == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - working-directory: integrations/dsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run fetch:native
          REQUIRE_NATIVE=1 npm test
          npm pack --pack-destination "$RUNNER_TEMP"
          cd "$(mktemp -d)"
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/zephor-dsh-agent-context-*.tgz
          node --input-type=module -e "import '@zephor/dsh-agent-context'; import '@zephor/dsh-agent-context/web-host'"
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-agent-context-npm
          path: ${{ runner.temp }}/zephor-dsh-agent-context-*.tgz
          if-no-files-found: error

  publish:
    needs: [versions, package]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.versions.outputs.plugin == 'true' && needs.package.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: dsh-agent-context-npm
          path: release
      - name: Publish the tested immutable npm version via OIDC
        run: bash .github/scripts/publish-dsh.sh

  refresh-index:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: dsh-agent-context-npm
          path: release
      - name: Check anonymous download against the tested archive
        id: verify
        run: python3 .github/scripts/verify-public-npm.py >> "$GITHUB_OUTPUT"
      - name: Request DSH index refresh
        if: steps.verify.outputs.stable == 'true'
        env:
          GH_TOKEN: ${{ secrets.DSH_INDEX_DISPATCH_TOKEN }}
        run: |
          : "${GH_TOKEN:?Configure DSH_INDEX_DISPATCH_TOKEN with Actions write access to Zephor5/dsh-plugins}"
          gh workflow run plugin-index.yml --repo Zephor5/dsh-plugins --ref main
