[package]
name = "agent-context"
version = "0.1.0"
edition = "2024"
# std::fs::File::lock (board and Web write locks) is stable since 1.89.
rust-version = "1.89"
description = "Shared context across agent tools and sessions: a maintained Markdown wiki and a machine-local blackboard"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Zephor5/agent-context"
keywords = ["mcp", "wiki", "agent", "markdown", "knowledge-base"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
pulldown-cmark = "0.13"
sha2 = "0.10"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
fastrand = "2.5.0"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "io-std", "net", "signal"] }

tower = { version = "0.5", features = ["util"] }
